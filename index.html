<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Il cammino di Cristian e Cristina - Catan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --card-locked: rgba(139, 125, 107, 0.85);
      --card-unlocked: rgba(212, 163, 115, 0.95);
      --accent: #d62828;
    }

    body {
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
      background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 
                  url('https://i.imgur.com/JJmmAYM.jpeg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    /* Titolo Matrimoniale Calligrafico */
    h1.wedding-title {
      font-family: 'Great Vibes', cursive;
      font-size: 4.2rem;
      background: linear-gradient(45deg, #fff0c7, #ffb703, #ff4d6d, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(2px 4px 10px rgba(0, 0, 0, 0.9));
      text-align: center;
      margin-top: 10px;
      margin-bottom: 25px;
      line-height: 1.2;
    }

    /* Contenitore Griglia Icone */
    .icons-container {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 850px;
      gap: 30px;
      margin-top: 30px;
      min-height: 140px;
      transition: opacity 0.6s ease;
    }

    .icon-card {
      flex: 1;
      aspect-ratio: 1;
      background-color: var(--card-locked);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      font-weight: bold;
      color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s ease, background-color 0.4s ease;
      position: relative;
    }

    .icon-card.unlocked {
      background-color: var(--card-unlocked);
      color: #fff;
    }

    .icon-card .content {
      display: none;
      font-size: 2.5rem;
    }

    .icon-card.unlocked .content {
      display: block;
    }

    .icon-card.unlocked .placeholder {
      display: none;
    }

    /* Area principale contenuto per animazioni */
    .stage-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 700px;
      margin-top: 40px;
      position: relative;
    }

    /* Pulsante Finale */
    #start-btn {
      padding: 15px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      display: none;
      transition: transform 0.2s ease;
    }

    #start-btn:hover {
      transform: scale(1.05);
    }

    /* Area Testo Animazione */
    #story-text {
      font-size: 1.7rem;
      font-weight: 600;
      text-align: center;
      color: #ffffff;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.9);
      min-height: 80px;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      margin-top: 30px;
    }

    #final-message {
      font-size: 2rem;
      font-weight: bold;
      color: #ffe6a7;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.9);
      text-align: center;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      margin-top: 30px;
    }

    /* Classi di animazione dinamiche */
    .hidden-card {
      opacity: 0;
      transform: scale(0.5);
    }

    .active-card {
      opacity: 1 !important;
      transform: scale(1.3) translateY(-10px) !important;
      z-index: 10;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }

    .settled-card {
      opacity: 1 !important;
      transform: scale(1) translateY(0) !important;
      z-index: 1;
    }
  </style>
</head>
<body>

  <h1 class="wedding-title">Il cammino di Cristian e Cristina</h1>

  <div class="icons-container" id="board">
    <div class="icon-card" id="card-strada">
      <span class="placeholder">?</span>
      <span class="content">🛣️</span>
    </div>
    <div class="icon-card" id="card-casa">
      <span class="placeholder">?</span>
      <span class="content">🏠</span>
    </div>
    <div class="icon-card" id="card-progresso">
      <span class="placeholder">?</span>
      <span class="content">📜</span>
    </div>
    <div class="icon-card" id="card-anello">
      <span class="placeholder">?</span>
      <span class="content">💍</span>
    </div>
  </div>

  <div class="stage-area">
    <button id="start-btn" onclick="startAnimation()">Inizia il Viaggio ❤️</button>
    <div id="story-text"></div>
    <div id="final-message">Vi auguriamo tantissima felicità e di poter sempre vincere al gioco della vita! ❤️</div>
  </div>

  <script>
    const items = ['strada', 'casa', 'progresso', 'anello'];
    
    // Controlla l'URL alla ricerca di nuovi sblocchi
    const urlParams = new URLSearchParams(window.location.search);
    const unlockedItem = urlParams.get('unlock');

    if (unlockedItem && items.includes(unlockedItem)) {
      localStorage.setItem('catan_' + unlockedItem, 'true');
    }

    // Aggiorna lo stato visivo delle tessere
    let unlockedCount = 0;
    items.forEach(item => {
      if (localStorage.getItem('catan_' + item) === 'true') {
        document.getElementById('card-' + item).classList.add('unlocked');
        unlockedCount++;
      }
    });

    // Mostra il pulsante se tutte le tessere sono sbloccate
    if (unlockedCount === 4) {
      document.getElementById('start-btn').style.display = 'block';
    }

    // Passaggi dell'animazione
    const steps = [
      { id: 'card-strada', text: 'Vi siete costruiti la vostra strada passo dopo passo...' },
      { id: 'card-casa', text: 'Insieme avete creato un posto da poter chiamare casa...' },
      { id: 'card-progresso', text: 'E nonostante tutte le difficoltà continuate a fare progressi...' },
      { id: 'card-anello', text: 'Tutto ciò vi ha portato ad oggi, il primo giorno del resto della vostra vita' }
    ];

    const delay = ms => new Promise(res => setTimeout(res, ms));

    async function startAnimation() {
      const startBtn = document.getElementById('start-btn');
      const textElem = document.getElementById('story-text');

      // Nasconde il pulsante
      startBtn.style.display = 'none';

      // 1. Fai sparire tutte e 4 le tessere
      items.forEach(id => {
        const card = document.getElementById('card-' + id);
        card.classList.add('hidden-card');
      });

      await delay(800);

      // 2. Sequenza una ad una
      for (let i = 0; i < steps.length; i++) {
        const step = steps[i];
        const card = document.getElementById(step.id);

        // La tessera appare ingrandita
        card.classList.remove('hidden-card');
        card.classList.add('active-card');
        await delay(600);

        // Appare la scritta dedicata
        textElem.innerText = step.text;
        textElem.style.opacity = '1';
        await delay(3800);

        // La scritta svanisce
        textElem.style.opacity = '0';
        await delay(800);

        // La tessera si posiziona nello slot della griglia (da sinistra a destra)
        card.classList.remove('active-card');
        card.classList.add('settled-card');
        await delay(600);
      }

      // 3. Quando tutte sono posizionate, appare il messaggio finale
      await delay(400);
      const finalMsg = document.getElementById('final-message');
      finalMsg.style.opacity = '1';
    }
  </script>
</body>
</html>
